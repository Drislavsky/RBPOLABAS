name: Java CI with Maven and TLS Artifact

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Получаем код
    - uses: actions/checkout@v4

    # 2. Настраиваем Java (выберите вашу версию, например 17 или 21)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache:maven: true

    # 3. Восстанавливаем Keystore из секретов
    # Мы декодируем Base64 обратно в файл и кладем его в src/main/resources
    - name: Decode Keystore
      run: |
        echo "${{ secrets.SSL_KEYSTORE_BASE64 }}" | base64 -d > src/main/resources/server-keystore.p12

    # 4. Сборка и Тестирование
    # Передаем пароль как переменную окружения, чтобы application.properties мог её подхватить
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      env:
        SSL_KEYSTORE_PASSWORD: ${{ secrets.SSL_KEYSTORE_PASSWORD }}

    # 5. Загрузка артефакта (JAR файла) в хранилище GitHub
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: autoservice-app
        path: target/*.jar
        retention-days: 5